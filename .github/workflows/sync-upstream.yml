name: Sync upstream

on:
  schedule:
    # 每天北京时间 06:00 (UTC 22:00 前一日)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_URL: https://github.com/superset-sh/superset.git
      UPSTREAM_BRANCH: main
      PATCHES_BRANCH: patches
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PATCHES_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name  "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL"
          # --force lets rolling tags like `desktop-canary` move forward instead
          # of being rejected with "would clobber existing tag".
          git fetch upstream "$UPSTREAM_BRANCH" --tags --force

      - name: Check sync capability
        id: sync-capability
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -n "$SYNC_TOKEN" ]; then
            token_available=true
          else
            token_available=false
          fi

          if git diff --quiet "origin/main..upstream/$UPSTREAM_BRANCH" -- .github/workflows; then
            workflow_updates=false
          else
            workflow_updates=true
          fi

          echo "token_available=$token_available" >> "$GITHUB_OUTPUT"
          echo "workflow_updates=$workflow_updates" >> "$GITHUB_OUTPUT"

          if [ "$token_available" = "false" ] && [ "$workflow_updates" = "true" ]; then
            echo "can_sync=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SYNC_TOKEN is not configured; GITHUB_TOKEN cannot push upstream workflow file updates."
          else
            echo "can_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report missing sync token
        if: steps.sync-capability.outputs.can_sync != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Sync upstream requires SYNC_TOKEN';
            const body = [
              'Automatic upstream sync detected workflow file updates from upstream.',
              '',
              'The default `GITHUB_TOKEN` cannot push commits or tags that create or update `.github/workflows/*` files.',
              '',
              'Configure a repository secret named `SYNC_TOKEN` with a token that can update workflow files, then rerun the sync workflow.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            try {
              if (existing) {
                core.notice(`Existing issue tracks this: #${existing.number}`);
              } else {
                const { data: issue } = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  title,
                  body,
                });
                core.notice(`Created issue #${issue.number}`);
              }
            } catch (error) {
              core.warning(`Could not create tracking issue: ${error.message}`);
            }

      - name: Fast-forward main from upstream
        if: steps.sync-capability.outputs.can_sync == 'true'
        run: |
          git checkout -B main upstream/$UPSTREAM_BRANCH
          git push origin main --force-with-lease
          git push origin --tags --force

      - name: Rebase patches onto upstream
        if: steps.sync-capability.outputs.can_sync == 'true'
        id: rebase
        run: |
          git checkout "$PATCHES_BRANCH"
          if git rebase upstream/$UPSTREAM_BRANCH; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort || true
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.sync-capability.outputs.can_sync == 'true' && steps.rebase.outputs.status == 'ok'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        if: steps.sync-capability.outputs.can_sync == 'true' && steps.rebase.outputs.status == 'ok'
        run: bun install --frozen --ignore-scripts

      - name: Typecheck
        if: steps.sync-capability.outputs.can_sync == 'true' && steps.rebase.outputs.status == 'ok'
        id: build
        continue-on-error: true
        env:
          SKIP_ENV_VALIDATION: "1"
        run: bun run typecheck

      - name: Push rebased patches
        if: steps.sync-capability.outputs.can_sync == 'true' && steps.rebase.outputs.status == 'ok' && steps.build.outcome == 'success'
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/$PATCHES_BRANCH)" ]; then
            echo "Nothing to push"
            exit 0
          fi
          git push origin "$PATCHES_BRANCH" --force-with-lease

      - name: Report failure
        if: steps.sync-capability.outputs.can_sync == 'true' && (steps.rebase.outputs.status == 'conflict' || steps.build.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const rebase = '${{ steps.rebase.outputs.status }}';
            const build  = '${{ steps.build.outcome }}';
            const title  = 'Upstream sync failed';
            const body = [
              'Automatic upstream sync encountered a problem.',
              '',
              `- Rebase status: \`${rebase}\``,
              `- Typecheck status:  \`${build}\``,
              '',
              'Resolve locally:',
              '',
              '```bash',
              'jj git fetch',
              'jj rebase -d main@origin -s patches',
              'jj resolve     # 如果出现冲突',
              'jj git push -b patches',
              '```',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'sync-conflict',
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                title, body,
                labels: ['sync-conflict'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            }
            core.setFailed('sync failed');
